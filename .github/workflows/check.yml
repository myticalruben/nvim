name: check

# La config de un editor falla en silencio: un LSP que no arranca no da un
# error, simplemente no autocompleta. Esto comprueba lo que si se puede
# comprobar sin abrir nvim: que el Lua es valido (checks.luacheck) y que el
# paquete evalua.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix flake check
